<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商家管理</title><link rel="stylesheet" href="style.css"><body><aside><div class="brand">16688 <small>商家管理</small></div><input id="search" placeholder="搜索功能，例如订单、库存"><nav id="nav"></nav></aside><main><header><span>工作台 / <b id="group">全部功能</b></span><span id="status">正在检查连接</span></header><section><p class="eyebrow">MERCHANT WORKSPACE</p><h1 id="title">商家管理</h1><p id="hint">选择左侧功能开始操作</p><div class="settings"><label>管理访问令牌<input id="token" type="password" placeholder="服务端 MANAGER_TOKEN，仅保存在当前页面"></label></div><article><div class="row"><h2>业务参数</h2><code id="path"></code></div><p class="muted">未填写的可选参数不会发送。数组和对象请填写 JSON。</p><form id="form"></form><details><summary>高级 JSON 参数（补充文档示例中的字段）</summary><textarea id="extra" rows="5">{}</textarea></details><div class="actions"><button id="example" class="secondary">填入文档示例</button><button id="submit">执行查询</button></div><p id="feedback" role="status"></p></article><article><div class="row"><h2>返回结果</h2><button id="clear" class="secondary">清空</button></div><div id="result">尚未执行接口请求。文档示例不代表真实数据。</div></article></section></main><script src="app.js"></script></body></html>
